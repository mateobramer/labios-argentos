<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Grabación — adaptación al hablante</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0d1117; --panel:#151b23; --line:#2a3340; --txt:#e6edf3; --muted:#8b96a5;
          --acc:#4aa3ff; --rec:#ef5e6b; --ok:#3fb968; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:16px/1.45 -apple-system, "Segoe UI", sans-serif; min-height:100vh;
         display:flex; align-items:center; justify-content:center; }
  main { display:grid; grid-template-columns: 480px 1fr; gap:1.4rem; width:min(1100px,94vw); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:1.1rem; }
  video { width:100%; border-radius:10px; background:#000; transform:scaleX(-1); }
  .frase { font-size:2rem; font-weight:700; margin:.6rem 0 1rem; min-height:5.2rem; }
  .prog { color:var(--muted); font-size:.95rem; }
  .barra { height:6px; background:var(--line); border-radius:3px; margin:.5rem 0 1rem; overflow:hidden; }
  .barra i { display:block; height:100%; width:0; background:var(--ok); transition:width .3s; }
  button { font:inherit; border:0; border-radius:10px; padding:.85rem 1.2rem; cursor:pointer; }
  #ptt { width:100%; background:var(--acc); color:#fff; font-size:1.15rem; font-weight:700;
         user-select:none; -webkit-user-select:none; touch-action:none; }
  #ptt.rec { background:var(--rec); }
  .fila { display:flex; gap:.6rem; margin-top:.7rem; }
  .fila button { flex:1; background:#232c38; color:var(--txt); }
  #estado { margin-top:.8rem; color:var(--muted); min-height:1.3em; }
  .done { color:var(--ok); }
</style>
</head>
<body>
<main>
  <section class="panel">
    <video id="cam" autoplay playsinline muted></video>
    <div id="estado">pidiendo cámara…</div>
  </section>
  <section class="panel">
    <div class="prog"><span id="idx">–</span> de <span id="total">–</span> · grabadas: <span id="hechas">0</span></div>
    <div class="barra"><i id="fill"></i></div>
    <div class="frase" id="frase">cargando frases…</div>
    <button id="ptt">🎙 MANTENÉ APRETADO y leé la frase</button>
    <div class="fila">
      <button id="ant">← anterior</button>
      <button id="sig">saltear →</button>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let frases = [], hechas = new Set(), i = 0;
let stream, recorder, chunks = [], mime = "";

function render() {
  $("idx").textContent = i + 1;
  $("total").textContent = frases.length;
  $("hechas").textContent = hechas.size;
  $("fill").style.width = (100 * hechas.size / Math.max(frases.length, 1)) + "%";
  $("frase").textContent = frases[i] || "(fin)";
  $("frase").className = "frase" + (hechas.has(i + 1) ? " done" : "");
  $("estado").textContent = hechas.has(i + 1) ? "esta ya está grabada (podés regrabarla)" : "";
}
function primeraPendiente() {
  for (let k = 0; k < frases.length; k++) if (!hechas.has(k + 1)) return k;
  return 0;
}
async function init() {
  const r = await fetch("/frases").then(x => x.json());
  frases = r.frases; hechas = new Set(r.hechas);
  i = primeraPendiente();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, frameRate: 30 }, audio: true });
    $("cam").srcObject = stream;
    mime = ["video/mp4", "video/webm;codecs=vp9", "video/webm"].find(m => MediaRecorder.isTypeSupported(m)) || "";
    $("estado").textContent = "listo para grabar ✔";
  } catch (e) { $("estado").textContent = "sin cámara: " + e.message; }
  render();
}
function empezar() {
  if (!stream || recorder?.state === "recording") return;
  chunks = [];
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = subir;
  recorder.start();
  $("ptt").classList.add("rec");
  $("ptt").textContent = "🔴 GRABANDO… soltá al terminar la frase";
}
function terminar() {
  if (recorder?.state === "recording") recorder.stop();
  $("ptt").classList.remove("rec");
  $("ptt").textContent = "🎙 MANTENÉ APRETADO y leé la frase";
}
async function subir() {
  const blob = new Blob(chunks, { type: mime || "video/webm" });
  if (blob.size < 20000) { $("estado").textContent = "muy corto, probá de nuevo"; return; }
  $("estado").textContent = "guardando…";
  const fd = new FormData();
  fd.append("clip", blob, "clip." + (mime.includes("mp4") ? "mp4" : "webm"));
  fd.append("indice", i + 1);
  fd.append("texto", frases[i]);
  const r = await fetch("/guardar", { method: "POST", body: fd }).then(x => x.json());
  if (r.ok) {
    hechas.add(i + 1);
    $("estado").textContent = "guardada ✔";
    if (hechas.size >= frases.length) { $("frase").textContent = "🎉 ¡Terminaste las " + frases.length + "!"; return; }
    i = primeraPendiente();
    render();
  } else { $("estado").textContent = "error: " + (r.error || "?"); }
}
$("ptt").addEventListener("pointerdown", (e) => { e.preventDefault(); empezar(); });
$("ptt").addEventListener("pointerup", terminar);
$("ptt").addEventListener("pointerleave", terminar);
$("ant").onclick = () => { i = Math.max(0, i - 1); render(); };
$("sig").onclick = () => { i = Math.min(frases.length - 1, i + 1); render(); };
window.addEventListener("keydown", (e) => { if (e.code === "Space" && !e.repeat) { e.preventDefault(); empezar(); } });
window.addEventListener("keyup", (e) => { if (e.code === "Space") { e.preventDefault(); terminar(); } });
init();
</script>
</body>
</html>
