<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Probar modelo · Labios Argentos</title><style>
body{margin:0;background:#091018;color:#eef6fb;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.app{width:min(1100px,94vw)}header{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.brand{letter-spacing:.16em;color:#8dd4f7;font-weight:800}.back{color:#a7b8c6;text-decoration:none}.cam{position:relative;background:#000;border-radius:22px;overflow:hidden;border:1px solid #2a4355}.cam img{display:block;width:100%;max-height:66vh;object-fit:cover}.caption{position:absolute;left:5%;right:5%;bottom:7%;text-align:center;font-size:clamp(25px,4vw,50px);font-weight:800;text-shadow:0 3px 16px #000}.status{margin:14px 0;text-align:center;color:#9eb2c0}.controls{text-align:center}.controls button{border:0;border-radius:10px;padding:11px 15px;background:#84cdf4;color:#07131c;font-weight:800;cursor:pointer}.controls a{margin-left:10px;color:#b9cad5}
</style><body><div class="app"><header><div class="brand">LABIOS ARGENTOS · MI MODELO</div><a class="back" href="/calibrar">seguir personalizando →</a></header><div class="cam"><img src="/video" alt="Cámara"><div class="caption" id="caption">Esperando que hables…</div></div><div class="status" id="status">Modelo personal activo</div><div class="controls"><button id="base">usar modelo base</button><a href="/calibrar">volver a entrenamiento</a></div></div><script>
const c=document.querySelector('#caption'),s=document.querySelector('#status');let last='';const ev=new EventSource('/events');ev.onmessage=e=>{const d=JSON.parse(e.data),x=d.segmentos||[];if(x.length){const t=x[x.length-1].texto;if(t!==last){last=t;c.textContent=t}}s.textContent=d.busy?'Transcribiendo…':'Modelo personal activo'};document.querySelector('#base').onclick=async()=>{const r=await fetch('/cal/base',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const d=await r.json();s.textContent=d.msg};</script></body></html>
