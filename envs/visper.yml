# Env de inferencia ViSpeR (PyTorch + ESPnet). ATENCIÓN: este env NO alcanza solo —
# el infer_server además necesita, dentro de ~/Desktop/visper (o $VISPER_DIR):
#   1. El código propio (datamodule/, lightning_vsr.py, conf/, spm/, visper_zeroshot.py),
#      versionado en vsr/visper/ (copiar de ahí — ver vsr/visper/README.md para qué falta).
#   2. Los pesos visper_vsr_base.pth (1.15 GB) — NO se versionan (supera el límite de
#      100 MB de GitHub); bajar de huggingface.co/tiiuae/visper (verificado 2026-07-11,
#      público sin login) o gs://labios-argentos-vsr-dataset.
# Crear:  conda env create -f envs/visper.yml
# NOTA: validado end-to-end 2026-07-11 (demo_web.py cargó visper_vsr_base.pth real
# sobre MPS y respondió). El espnet vendoreado en vsr/visper/espnet/ (con sus
# __init__.py) tapa al espnet de pip — si falta algún __init__.py ahí, Python cae
# al espnet de pip y ese pide `chainer` (dependencia vieja que no usamos).
# setuptools<81 es necesario: versiones más nuevas sacaron pkg_resources, que
# pide librosa (dependencia transitiva de pytorch_lightning vía torchmetrics).
name: visper
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch
      - torchvision
      - torchaudio
      - espnet
      - pytorch_lightning
      - six
      - "setuptools<81"
      - numpy
      - requests        # llamadas al Ollama local para el n-best rescoring
