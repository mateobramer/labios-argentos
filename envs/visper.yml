# Env de inferencia ViSpeR (PyTorch + ESPnet). ATENCIÓN: este env NO alcanza solo —
# el infer_server además necesita:
#   1. El clon del repo ViSpeR en ~/Desktop/visper (o $VISPER_DIR), que incluye
#      los módulos datamodule/, lightning_vsr.py y el visper_zeroshot.py del equipo.
#   2. Los pesos visper_vsr_base.pth (1.1 GB) dentro de ese clon — NO se versionan;
#      copia en gs://labios-argentos-vsr-dataset o el release de ViSpeR/TII.
# Crear:  conda env create -f envs/visper.yml
# NOTA: spec de referencia reconstruida de AGENTS.md/README (el env original vive en
# la máquina de desarrollo); no fue posible validarla end-to-end sin el clon+pesos.
name: visper
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch
      - torchaudio
      - espnet
      - numpy
      - requests        # llamadas al Ollama local para el n-best rescoring
